<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Climatempo</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <h1>Climatempo </h1>
        <p>Consulte o clima da sua cidade</p>
    </header>

    <main>

        <div class="pesquisa">
            <input type="text" id="cidade" placeholder="Digite uma cidade">

            <button onclick="buscarClima()">
                Pesquisar
            </button>
        </div>

        <div id="resultado" class="resultado">
            <h2>Digite uma cidade</h2>
            <p>Depois clique em pesquisar.</p>
        </div>

        <div class="grafico">
            <h2>Temperatura nas próximas horas</h2>

            <canvas id="graficoTemperatura"></canvas>
        </div>

    </main>

    <footer> ° SENAI</footer>

    <script src="script.js"></script>

</body>

</html>
