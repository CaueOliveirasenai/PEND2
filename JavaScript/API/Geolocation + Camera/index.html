<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Tracker</title>

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap"
        rel="stylesheet">


    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<!----   ---->

<body>

    <div class="container">

        <header>

            
            <div class="icone">
                <i class="fa-solid fa-gamepad"></i>
            </div>

            <h1>GAME <span>TRACKER</span></h1>

            <p>
                Registre sua sessão de jogo
            </p>

        </header>


        <main>

            

            <section class="card">

                <div class="titulo-card">

                    
                    <span class="icone-card">
                        <i class="fa-solid fa-location-dot"></i>
                    </span>

                    <div>
                        <h2>Localização</h2>
                        <p>Informações da sua localização</p>
                    </div>

                </div>

                <button onclick="obterLocalizacao()">
                    Obter Localização
                </button>

                <div class="informacoes">

                    <div class="info">
                        <strong>Latitude</strong>
                        <span id="latitude">--</span>
                    </div>

                    <div class="info">
                        <strong>Longitude</strong>
                        <span id="longitude">--</span>
                    </div>

                    <div class="info">
                        <strong>Precisão</strong>
                        <span id="precisao">--</span>
                    </div>

                </div>

            </section>


            <!-- CÂMERA -->

            <section class="card">

                <div class="titulo-card">

                    <!-- Ícone de câmera -->
                    <span class="icone-card">
                        <i class="fa-solid fa-camera"></i>
                    </span>

                    <div>
                        <h2>Câmera</h2>
                        <p>Visualize sua câmera</p>
                    </div>

                </div>

                <button onclick="abrirCamera()">
                    Abrir Câmera
                </button>

                <div class="camera-box">

                    <video id="camera" autoplay></video>

                    <div class="camera-text" id="cameraTexto">

                        <i class="fa-solid fa-camera"></i>

                        <br>

                        A câmera aparecerá aqui

                    </div>

                </div>

            </section>

        </main>


        <footer>

            <p>
                GAME TRACKER <span>•</span> Web APIs
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
